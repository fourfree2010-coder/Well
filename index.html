<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GODMYEGXO | Official</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="gate-page">
  <!-- Background Music (hidden) -->
  <audio id="bgMusic" loop></audio>

  <div class="gate-container" id="gateContainer">
    <div class="gate-content">
      <div class="logo-area">
        <div class="logo-circle">
          <i class="fas fa-crown"></i>
        </div>
        <h1 class="site-title" id="siteTitle">GODMYEGXO</h1>
        <p class="site-subtitle" id="siteSubtitle">EST. 2026</p>
      </div>

      <button class="enter-btn" id="enterBtn">
        <span>ENTER</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <div class="social-links" id="socialLinks">
        <!-- Will be filled by JS -->
      </div>
    </div>

    <div class="gate-particles"></div>
  </div>

  <!-- Mini Player -->
  <div class="mini-player" id="miniPlayer">
    <div class="player-info">
      <div class="player-icon"><i class="fas fa-music"></i></div>
      <div class="player-text">
        <div class="track-name" id="trackName">Ariana Grande - bye [Altare Remix]</div>
        <div class="track-artist">GODMYEGXO</div>
      </div>
    </div>
    <div class="player-controls">
      <button id="playPauseBtn"><i class="fas fa-play"></i></button>
      <input type="range" id="volumeSlider" min="0" max="100" value="50" />
    </div>
  </div>

    <script src="js/config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/music.js"></script>
  <script src="js/gate.js"></script>
</body>
</html>
